name: Build and deploy ARGO MOSAIC to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - hostinger-package/database*.sql
      - hostinger-package/database_export.json
      - hostinger-package/INSTRUCCIONES_INSTALACION_HOSTINGER.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argo-mosaic-hostinger-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build React application
        run: bun run build

      - name: Set up PHP for syntax checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, mbstring

      - name: Validate PHP files
        run: find hostinger-package/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Assemble Hostinger package
        env:
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          test -n "$DB_PASS" || (echo 'Missing GitHub Actions secret DB_PASS' && exit 1)
          cp -a dist/. hostinger-package/
          DB_PASS_B64="$(printf '%s' "$DB_PASS" | base64 -w 0)"
          cat > hostinger-package/api/config.local.php <<EOF
          <?php
          define('DB_HOST', 'localhost');
          define('DB_NAME', 'u596885302_database');
          define('DB_USER', 'u596885302_gerencia');
          define('DB_PASS', base64_decode('${DB_PASS_B64}'));
          define('DB_CHARSET', 'utf8mb4');
          EOF
          php -l hostinger-package/api/config.local.php
          head -n 1 hostinger-package/api/config.local.php | grep -qx '<?php'
          grep -q 'DB_PASS' hostinger-package/api/config.local.php
          test -s hostinger-package/index.html
          test -s hostinger-package/api/config.local.php

      - name: Inspect FTP account root and domain folders
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import ftplib, os
          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=20)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          print("FTP PWD:", ftp.pwd())
          def show(path):
              try:
                  print("LIST", path)
                  for item in ftp.nlst(path):
                      print(" ", item)
              except Exception as e:
                  print("UNAVAILABLE", path, type(e).__name__, str(e)[:180])
          show("/")
          show("/public_html")
          show("/domains")
          show("/domains/lavdigitalagency.com")
          show("/domains/lavdigitalagency.com/public_html")
          ftp.quit()
          PY

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./hostinger-package/
          server-dir: /domains/lavdigitalagency.com/public_html/Argo-Mosaic/
          exclude: |
            **/database*.sql
            **/database_export.json
            **/INSTRUCCIONES_INSTALACION_HOSTINGER.md
            **/uploads/**

      - name: Diagnose public Hostinger paths
        if: always()
        run: |
          for path in "/" "/Argo-Mosaic/" "/Argo-Mosaic/index.html" "/Argo-Mosaic/manifest.json" "/Argo-Mosaic/assets/index-De31qaFu.js" "/Argo-Mosaic/api/products"; do
            echo "===== $path ====="
            curl -sS -L --max-time 20 -A "Mozilla/5.0" -D - -o /tmp/argo-response "https://lavdigitalagency.com$path" -w "HTTP_STATUS=%{http_code} CONTENT_TYPE=%{content_type} SIZE=%{size_download} FINAL_URL=%{url_effective}\n" || true
            head -c 350 /tmp/argo-response 2>/dev/null || true
            echo
          done

      - name: Verify production frontend and database API
        run: |
          curl --fail --silent --show-error https://lavdigitalagency.com/Argo-Mosaic/ | grep -q 'assets/'
          curl --fail --silent --show-error https://lavdigitalagency.com/Argo-Mosaic/api/products | grep -q '"success":true'
